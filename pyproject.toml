[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envelopeseal"
version = "1.0.1"
description = "Offline auditor for an envelope encryption key hierarchy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EnvelopeSeal contributors" }]
keywords = ["envelope-encryption", "kek", "dek", "key-wrapping", "audit"]

[project.scripts]
envelopeseal = "envelopeseal.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

