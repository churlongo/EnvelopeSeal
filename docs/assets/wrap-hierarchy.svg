<?xml version="1.0" encoding="UTF-8"?>
<!--
  Palette reason: same subject as the logo, so the same two core colours. Navy
  (#1f2a44) draws key encrypting keys and all connectors, a neutral slate grey
  (#5b6b7a) fills data keys to separate the two roles at a glance, and the one
  accent, seal-wax red (#b23a2e), marks exactly one thing: the root key, whose
  blast radius of 4 is the widest and the first place a reader should look.
  Neutrals (white plate, grey text) do not count toward the budget. Flat fills
  only. No gradient, blur, glow, or grid.

  Every number on this diagram is real. It was produced by running
    PYTHONPATH=src python -m envelopeseal blast samples/healthy.manifest
  which printed:
    root-hsm blast 4
    mid-payments-kek blast 2
    mid-telemetry-kek blast 2
  The graph edges are the six wrap records in samples/healthy.manifest.

  Geometry: boxes on an 8px grid, one box stroke width (1.5), one connector
  stroke width (1), one corner radius (3), 16px padding kept clear of the edge.
  Text baselines align across each row. Renders on its own white plate.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img" aria-labelledby="title desc">
  <title id="title">envelopeseal wrap hierarchy for the healthy sample</title>
  <desc id="desc">A three level directed graph. The root key encrypting key root-hsm, marked in the accent colour, has blast radius 4 and wraps two key encrypting keys. mid-payments-kek, blast radius 2, wraps data keys dek-orders and dek-invoices. mid-telemetry-kek, blast radius 2, wraps data keys dek-events and dek-metrics. Arrows point from a wrapping key down to the key it wraps.</desc>

  <rect x="0" y="0" width="560" height="360" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#1f2a44"/>
    </marker>
  </defs>

  <!-- Connectors first so boxes paint over their ends. Stroke width 1. -->
  <g fill="none" stroke="#1f2a44" stroke-width="1" marker-end="url(#arrow)">
    <!-- root to two mid keks -->
    <path d="M280 72 L152 120"/>
    <path d="M280 72 L408 120"/>
    <!-- mid-payments to its two data keys -->
    <path d="M128 168 L72 224"/>
